<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportDesk AI - Enterprise CRM Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 bg-slate-900/80 p-4 rounded-xl border border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">SupportDesk AI</h1>
                    <p class="text-xs text-slate-400">Enterprise CRM Console</p>
                </div>
            </div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                System Live
            </span>
        </header>

        <!-- New Ticket Form -->
        <section class="mb-8 bg-slate-900/50 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-lg font-semibold mb-4">Create New Ticket</h2>
            <form id="createTicketForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="custName" placeholder="Customer Full Name" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    <input type="email" id="custEmail" placeholder="Customer Email Address" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <input type="text" id="ticketSubject" placeholder="Brief issue summary" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                <textarea id="ticketDesc" rows="3" placeholder="Describe the problem in detail..." required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                <div class="flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl transition text-sm">Submit Ticket</button>
                </div>
            </form>
        </section>

        <!-- Filters & Search -->
        <section class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-6">
            <input type="text" id="searchInput" onkeyup="fetchTickets()" placeholder="Search ID, Name, Email..." class="w-full sm:w-80 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <select id="statusFilter" onchange="fetchTickets()" class="w-full sm:w-auto bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                <option value="All">Filter Status: All</option>
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
            </select>
        </section>

        <!-- Tickets Table -->
        <div class="bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-slate-800">
                    <tr>
                        <th class="p-4">Ticket ID</th>
                        <th class="p-4">Customer</th>
                        <th class="p-4">Subject</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="ticketsTableBody" class="divide-y divide-slate-800/50 text-sm">
                    <!-- Rows dynamically generated -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Manage Ticket Modal -->
    <div id="manageModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-white">Manage Ticket</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <div id="modalDetails" class="text-xs text-slate-300 space-y-2 bg-slate-950 p-3 rounded-xl"></div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Update Status</label>
                <select id="updateStatusSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200">
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Add Note</label>
                <textarea id="updateNoteText" rows="2" placeholder="Internal notes..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"></textarea>
            </div>
            
            <div id="notesHistory" class="space-y-1 max-h-32 overflow-y-auto text-xs border-t border-slate-800 pt-2"></div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                <button type="button" onclick="deleteCurrentTicket()" class="bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition">
                    Delete Ticket
                </button>
                <div class="space-x-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-slate-400 hover:text-white">Cancel</button>
                    <button type="button" onclick="saveTicketChanges()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-medium">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTicketId = null;

        async function fetchTickets() {
            const search = document.getElementById('searchInput').value;
            const status = document.getElementById('statusFilter').value;
            let url = `/api/tickets?status=${status}`;
            if(search) url += `&search=${encodeURIComponent(search)}`;

            const res = await fetch(url);
            const tickets = await res.json();
            const tbody = document.getElementById('ticketsTableBody');
            tbody.innerHTML = '';

            tickets.forEach(t => {
                let badgeClass = 'bg-sky-500/10 text-sky-400 border-sky-500/20';
                if(t.status === 'Open') badgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                if(t.status === 'Closed') badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-900/80 transition">
                        <td class="p-4 font-mono font-bold text-indigo-400">${t.ticket_id}</td>
                        <td class="p-4"><div class="font-medium">${t.customer_name}</div><div class="text-xs text-slate-500">${t.customer_email}</div></td>
                        <td class="p-4 text-slate-300">${t.subject}</td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs border ${badgeClass}">${t.status}</span></td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="openModal('${t.ticket_id}')" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700">Manage</button>
                            <button onclick="quickDelete('${t.ticket_id}')" class="bg-red-500/10 hover:bg-red-600 text-red-400 hover:text-white text-xs px-2.5 py-1.5 rounded-lg border border-red-500/20 transition">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('createTicketForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                customer_name: document.getElementById('custName').value,
                customer_email: document.getElementById('custEmail').value,
                subject: document.getElementById('ticketSubject').value,
                description: document.getElementById('ticketDesc').value
            };
            await fetch('/api/tickets', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            document.getElementById('createTicketForm').reset();
            fetchTickets();
        };

        async function openModal(id) {
            currentTicketId = id;
            const res = await fetch(`/api/tickets/${id}`);
            const data = await res.json();
            
            document.getElementById('modalTitle').innerText = `Manage ${data.ticket_id}`;
            document.getElementById('modalDetails').innerHTML = `
                <div><strong>Customer:</strong> ${data.customer_name} (${data.customer_email})</div>
                <div><strong>Subject:</strong> ${data.subject}</div>
                <div><strong>Description:</strong> ${data.description}</div>
            `;
            document.getElementById('updateStatusSelect').value = data.status;
            document.getElementById('updateNoteText').value = '';

            const history = document.getElementById('notesHistory');
            history.innerHTML = '<strong class="text-slate-400">Notes History:</strong>';
            if(data.notes && data.notes.length > 0) {
                data.notes.forEach(n => {
                    history.innerHTML += `<div class="text-slate-400 border-l-2 border-indigo-500 pl-2 my-1">${n.note_text} <span class="text-[10px] text-slate-600">(${n.created_at})</span></div>`;
                });
            } else {
                history.innerHTML += '<div class="text-slate-600 italic">No notes yet.</div>';
            }

            document.getElementById('manageModal').classList.remove('hidden');
            document.getElementById('manageModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('manageModal').classList.add('hidden');
            document.getElementById('manageModal').classList.remove('flex');
        }

        async function saveTicketChanges() {
            const status = document.getElementById('updateStatusSelect').value;
            const note = document.getElementById('updateNoteText').value;

            await fetch(`/api/tickets/${currentTicketId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status, note})
            });
            closeModal();
            fetchTickets();
        }

        async function deleteCurrentTicket() {
            if(!confirm(`Are you sure you want to delete ${currentTicketId}?`)) return;
            await fetch(`/api/tickets/${currentTicketId}`, { method: 'DELETE' });
            closeModal();
            fetchTickets();
        }

        async function quickDelete(id) {
            if(!confirm(`Are you sure you want to delete ${id}?`)) return;
            await fetch(`/api/tickets/${id}`, { method: 'DELETE' });
            fetchTickets();
        }

        fetchTickets();
    </script>
</body>
</html>
