<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support CRM System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Customer Support CRM</h1>
        
        <!-- Create Ticket Form -->
        <div class="bg-gray-50 p-4 rounded-md mb-8 border">
            <h2 class="text-xl font-semibold mb-3 text-gray-700">Create New Ticket</h2>
            <form id="ticketForm" class="grid grid-cols-2 gap-4">
                <input type="text" id="custName" placeholder="Customer Name" class="p-2 border rounded" required>
                <input type="email" id="custEmail" placeholder="Customer Email" class="p-2 border rounded" required>
                <input type="text" id="subject" placeholder="Subject" class="col-span-2 p-2 border rounded" required>
                <textarea id="description" placeholder="Issue Description" class="col-span-2 p-2 border rounded" rows="3" required></textarea>
                <button type="submit" class="col-span-2 bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-semibold">Submit Ticket</button>
            </form>
        </div>

        <!-- Filters & Search -->
        <div class="flex justify-between items-center mb-4 gap-4">
            <input type="text" id="search" placeholder="Search by name, ID, email..." class="p-2 border rounded w-1/3" oninput="loadTickets()">
            <select id="statusFilter" class="p-2 border rounded" onchange="loadTickets()">
                <option value="">All Statuses</option>
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
            </select>
        </div>

        <!-- Tickets Table -->
        <table class="w-full border-collapse border border-gray-200">
            <thead>
                <tr class="bg-gray-200 text-left text-gray-700">
                    <th class="p-2 border">ID</th>
                    <th class="p-2 border">Customer</th>
                    <th class="p-2 border">Subject</th>
                    <th class="p-2 border">Status</th>
                    <th class="p-2 border">Action</th>
                </tr>
            </thead>
            <tbody id="ticketsList">
                <!-- Loaded dynamically -->
            </tbody>
        </table>
    </div>

    <!-- Update Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-1/2">
            <h2 class="text-xl font-bold mb-2" id="modalTitle">Ticket Details</h2>
            <p id="modalDesc" class="text-gray-600 mb-4"></p>
            <label class="block mb-2 font-semibold">Change Status:</label>
            <select id="modalStatus" class="p-2 border rounded w-full mb-4">
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
            </select>
            <label class="block mb-2 font-semibold">Add Internal Note:</label>
            <textarea id="modalNote" class="p-2 border rounded w-full mb-4" placeholder="Write a note..."></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-300 rounded">Cancel</button>
                <button onclick="saveUpdate()" class="px-4 py-2 bg-green-600 text-white rounded">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        let currentTicketId = null;

        async function loadTickets() {
            const search = document.getElementById("search").value;
            const status = document.getElementById("statusFilter").value;
            let url = `${API_BASE}/tickets?`;
            if (search) url += `search=${search}&`;
            if (status) url += `status=${status}`;

            const res = await fetch(url);
            const data = await res.json();
            
            const tbody = document.getElementById("ticketsList");
            tbody.innerHTML = data.map(t => `
                <tr class="border-t hover:bg-gray-50">
                    <td class="p-2 font-mono font-bold">${t.ticket_id}</td>
                    <td class="p-2">${t.customer_name}<br><span class="text-xs text-gray-500">${t.customer_email}</span></td>
                    <td class="p-2">${t.subject}</td>
                    <td class="p-2"><span class="px-2 py-1 text-xs rounded ${t.status === 'Open' ? 'bg-yellow-200 text-yellow-800' : t.status === 'In Progress' ? 'bg-blue-200 text-blue-800' : 'bg-green-200 text-green-800'}">${t.status}</span></td>
                    <td class="p-2"><button onclick="openModal('${t.ticket_id}')" class="text-blue-600 underline">View/Update</button></td>
                </tr>
            `).join("");
        }

        document.getElementById("ticketForm").onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                customer_name: document.getElementById("custName").value,
                customer_email: document.getElementById("custEmail").value,
                subject: document.getElementById("subject").value,
                description: document.getElementById("description").value,
            };
            await fetch(`${API_BASE}/tickets`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            e.target.reset();
            loadTickets();
        };

        async function openModal(id) {
            currentTicketId = id;
            const res = await fetch(`${API_BASE}/tickets/${id}`);
            const t = await res.json();
            document.getElementById("modalTitle").innerText = `${t.ticket_id}: ${t.subject}`;
            document.getElementById("modalDesc").innerText = `Description: ${t.description}`;
            document.getElementById("modalStatus").value = t.status;
            document.getElementById("modalNote").value = "";
            document.getElementById("modal").classList.remove("hidden");
        }

        function closeModal() { document.getElementById("modal").classList.add("hidden"); }

        async function saveUpdate() {
            await fetch(`${API_BASE}/tickets/${currentTicketId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    status: document.getElementById("modalStatus").value,
                    note: document.getElementById("modalNote").value
                })
            });
            closeModal();
            loadTickets();
        }

        loadTickets();
    </script>
</body>
</html>
