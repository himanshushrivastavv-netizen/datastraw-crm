<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-headset text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">SupportDesk AI</h1>
                <p class="text-xs text-slate-400">Enterprise CRM Console</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> System Live
            </span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 md:p-8 space-y-8">

        <!-- Stats Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-800/50 border border-slate-700/60 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Tickets</p>
                    <h3 class="text-2xl font-bold text-white mt-1" id="statTotal">0</h3>
                </div>
                <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl"><i class="fa-solid fa-ticket text-xl"></i></div>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/60 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Open Issues</p>
                    <h3 class="text-2xl font-bold text-amber-400 mt-1" id="statOpen">0</h3>
                </div>
                <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl"><i class="fa-solid fa-folder-open text-xl"></i></div>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/60 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">In Progress</p>
                    <h3 class="text-2xl font-bold text-sky-400 mt-1" id="statProgress">0</h3>
                </div>
                <div class="p-3 bg-sky-500/10 text-sky-400 rounded-xl"><i class="fa-solid fa-spinner text-xl"></i></div>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/60 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Resolved</p>
                    <h3 class="text-2xl font-bold text-emerald-400 mt-1" id="statClosed">0</h3>
                </div>
                <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl"><i class="fa-solid fa-circle-check text-xl"></i></div>
            </div>
        </div>

        <!-- Create Ticket Form Card -->
        <div class="bg-slate-800/40 border border-slate-700/60 p-6 rounded-2xl shadow-xl backdrop-blur-sm">
            <div class="flex items-center gap-2 mb-6">
                <i class="fa-solid fa-plus-circle text-indigo-400"></i>
                <h2 class="text-lg font-semibold text-white">Raise New Support Ticket</h2>
            </div>
            <form id="ticketForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Customer Name</label>
                    <input type="text" id="custName" placeholder="e.g. Rahul Sharma" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Customer Email</label>
                    <input type="email" id="custEmail" placeholder="rahul@example.com" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Subject</label>
                    <input type="text" id="subject" placeholder="Brief issue summary" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Detailed Description</label>
                    <textarea id="description" placeholder="Describe the problem in detail..." class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all" rows="3" required></textarea>
                </div>
                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition-all text-sm flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Submit Ticket
                    </button>
                </div>
            </form>
        </div>

        <!-- Search & Ticket List -->
        <div class="space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="search" placeholder="Search ID, Name, Email..." class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all" oninput="loadTickets()">
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                    <select id="statusFilter" class="bg-slate-800/60 border border-slate-700/60 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all" onchange="loadTickets()">
                        <option value="">Filter Status: All</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
            </div>

            <!-- Table Container -->
            <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl overflow-hidden backdrop-blur-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-800/80 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-700/60">
                            <tr>
                                <th class="py-3.5 px-6">Ticket ID</th>
                                <th class="py-3.5 px-6">Customer</th>
                                <th class="py-3.5 px-6">Subject</th>
                                <th class="py-3.5 px-6">Status</th>
                                <th class="py-3.5 px-6 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsList" class="divide-y divide-slate-800/60">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Detail & Edit Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-6 shadow-2xl">
            <div class="flex justify-between items-start border-b border-slate-700/60 pb-4">
                <div>
                    <span id="modalId" class="text-xs font-mono font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20"></span>
                    <h3 id="modalSubject" class="text-lg font-bold text-white mt-2"></h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="space-y-4 text-sm">
                <div>
                    <p class="text-xs text-slate-400">Description</p>
                    <p id="modalDesc" class="text-slate-200 mt-1 bg-slate-900/60 p-3 rounded-xl border border-slate-700/40"></p>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Update Status</label>
                    <select id="modalStatus" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Add Resolution/Internal Note</label>
                    <textarea id="modalNote" rows="2" placeholder="Write internal updates..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 text-slate-300 hover:bg-slate-700/50 rounded-xl text-sm transition-all">Cancel</button>
                <button onclick="saveUpdate()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition-all">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        let currentTicketId = null;

        async function loadTickets() {
            const search = document.getElementById("search").value;
            const status = document.getElementById("statusFilter").value;
            let url = `${API_BASE}/tickets?`;
            if (search) url += `search=${search}&`;
            if (status) url += `status=${status}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                // Update Stats Metrics
                document.getElementById("statTotal").innerText = data.length;
                document.getElementById("statOpen").innerText = data.filter(t => t.status === 'Open').length;
                document.getElementById("statProgress").innerText = data.filter(t => t.status === 'In Progress').length;
                document.getElementById("statClosed").innerText = data.filter(t => t.status === 'Closed').length;

                const tbody = document.getElementById("ticketsList");
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500">No tickets found matching criteria</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(t => `
                    <tr class="hover:bg-slate-800/50 transition-all">
                        <td class="py-4 px-6 font-mono font-bold text-indigo-400">${t.ticket_id}</td>
                        <td class="py-4 px-6">
                            <div class="font-medium text-white">${t.customer_name}</div>
                            <div class="text-xs text-slate-400">${t.customer_email}</div>
                        </td>
                        <td class="py-4 px-6 text-slate-200">${t.subject}</td>
                        <td class="py-4 px-6">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold ${
                                t.status === 'Open' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 
                                t.status === 'In Progress' ? 'bg-sky-500/10 text-sky-400 border border-sky-500/20' : 
                                'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                            }">
                                ${t.status}
                            </span>
                        </td>
                        <td class="py-4 px-6 text-right">
                            <button onclick="openModal('${t.ticket_id}')" class="text-indigo-400 hover:text-indigo-300 font-medium text-xs bg-indigo-500/10 hover:bg-indigo-500/20 px-3 py-1.5 rounded-lg border border-indigo-500/20 transition-all">
                                Manage
                            </button>
                        </td>
                    </tr>
                `).join("");
            } catch (e) {
                console.error("API error", e);
            }
        }

        document.getElementById("ticketForm").onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                customer_name: document.getElementById("custName").value,
                customer_email: document.getElementById("custEmail").value,
                subject: document.getElementById("subject").value,
                description: document.getElementById("description").value,
            };
            await fetch(`${API_BASE}/tickets`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            e.target.reset();
            loadTickets();
        };

        async function openModal(id) {
            currentTicketId = id;
            const res = await fetch(`${API_BASE}/tickets/${id}`);
            const t = await res.json();
            document.getElementById("modalId").innerText = t.ticket_id;
            document.getElementById("modalSubject").innerText = t.subject;
            document.getElementById("modalDesc").innerText = t.description;
            document.getElementById("modalStatus").value = t.status;
            document.getElementById("modalNote").value = "";
            document.getElementById("modal").classList.remove("hidden");
        }

        function closeModal() { document.getElementById("modal").classList.add("hidden"); }

        async function saveUpdate() {
            await fetch(`${API_BASE}/tickets/${currentTicketId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    status: document.getElementById("modalStatus").value,
                    note: document.getElementById("modalNote").value
                })
            });
            closeModal();
            loadTickets();
        }

        loadTickets();
    </script>
</body>
</html>
